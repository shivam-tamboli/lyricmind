services:
  - type: web
    name: lyricmind-backend
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/lyricmind-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: SPRING_DATA_MONGODB_DATABASE
        value: lyricmind
      - key: SPRING_AI_OPENAI_API_KEY
        sync: false
      - key: SPRING_AI_OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-large
      - key: SPRING_AI_OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: SPRING_AI_VECTOR_COLLECTION
        value: lyricmind_vector_store
      - key: SPRING_AI_VECTOR_INIT_SCHEMA
        value: "true"
      - key: SPRING_AI_VECTOR_PATH_NAME
        value: embedding
      - key: SPRING_AI_VECTOR_INDEX_NAME
        value: lyricmind_vector_index

