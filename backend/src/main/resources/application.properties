spring.application.name=lyricmind
server.port=${PORT:8080}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:lyricmind}

spring.ai.vectorstore.mongodb.collection-name=${SPRING_AI_VECTOR_COLLECTION:lyricmind_vector_store}
spring.ai.vectorstore.mongodb.initialize-schema=${SPRING_AI_VECTOR_INIT_SCHEMA:false}
spring.ai.vectorstore.mongodb.path-name=${SPRING_AI_VECTOR_PATH_NAME:embedding}
spring.ai.vectorstore.mongodb.index-name=${SPRING_AI_VECTOR_INDEX_NAME:lyricmind_vector_index}

spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_MODEL:gpt-4o-mini}

management.endpoints.web.exposure.include=health,info

# --- Caching (Caffeine) ---
# Caches recommendation results by (mood, limit) to avoid repeated OpenAI + DB calls.
# TTL: 15 minutes | Max entries: 500 (covers a broad vocabulary of moods)
# Cache is automatically evicted when new songs are ingested.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=15m
